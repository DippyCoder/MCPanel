[package]
name = "mcpanel"
version = "2.2.0"
edition = "2021"
authors = ["dippycoder"]
description = "Minecraft Server Panel v2"
license = "GPL-3.0"

[lib]
name = "mcpanel_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = "0.4.45"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
